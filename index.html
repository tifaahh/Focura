<title>Attention Gym</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Attention Gym</h1>
    <p>Latih fokusmu, detox digital dengan sadar.</p>
  </header>

  <main>
    <section>
      <h2>Timer Fokus 25 Menit</h2>
      <div id="timer">25:00</div>
      <button id="start">Mulai</button>
      <button id="reset">Reset</button>
    </section>

    <section>
      <h2>Latihan Pernapasan 4-7-8</h2>
      <p>Tarik napas 4 detik, tahan 7 detik, buang 8 detik.</p>
      <button id="breath">Mulai Latihan</button>
    </section>

    <section>
      <h2>Progress</h2>
      <p>Total Menit Fokus: <span id="total">0</span></p>
    </section>
  </main>
